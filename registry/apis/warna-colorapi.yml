slug: warna-colorapi
nama: 'Info Warna'
kategori: referensi
deskripsi: Ubah kode heksa warna menjadi nama, nilai RGB/HSL, dan skema warna yang serasi.
developer:
  nama: Josh Beckman
  profil: 'https://www.thecolorapi.com/'
