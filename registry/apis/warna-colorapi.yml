endpoints:
  - id: info
    method: GET
    path: '/id?hex={hex}'
    deskripsi: 'Detail satu warna: nama, rgb, hsl, hsv, cmyk, kontras teks.'
    params:
      - nama: hex
        contoh: '0047AB'
        wajib: true
        keterangan: 'kode heksa tanpa tanda pagar, mis. 0047AB'
    contohPath: '/id?hex=0047AB'
    minUkuranByte: 150
  - id: skema
    method: GET
    path: '/scheme?hex={hex}&count=5'
    deskripsi: 'Lima warna yang serasi dari warna dasar.'
    params:
      - nama: hex
        contoh: '0047AB'
        wajib: true
        keterangan: 'kode heksa warna dasar tanpa tanda pagar'
    contohPath: '/scheme?hex=0047AB&count=5'
    minUkuranByte: 200
