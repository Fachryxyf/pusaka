    method: GET
    path: '/api/prices/{sumber}'
    deskripsi: 'Harga dari satu sumber. buybackPrice sering null atau 0 - 8 dari 18 sumber begitu, jadi jangan diasumsikan ada. weight berupa number desimal (0.01 sampai 1000) dan weightUnit tidak seragam (gr vs gram).'
    params:
      - nama: sumber
        contoh: 'anekalogam'
        wajib: true
        keterangan: 'Ambil dari endpoint daftarSumber. Sumber tidak dikenal membalas 404 dengan body TEKS BIASA, bukan JSON'
    contohPath: /api/prices/anekalogam
