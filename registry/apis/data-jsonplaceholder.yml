    method: GET
    path: '/posts?userId={userId}'
    deskripsi: 'Semua postingan milik satu pengguna.'
    params:
      - nama: userId
        contoh: '1'
        wajib: true
        keterangan: 'id pengguna (1-10)'
    contohPath: '/posts?userId=1'
