developer:
  nama: fitrahive
  profil: 'https://github.com/fitrahive'
dokumentasi: 'https://github.com/fitrahive/dua-dhikr'
upstreamName: 'Dua & Dhikr'
auth: none
cors: open
baseUrl: 'https://dua-dhikr.vercel.app'
mirror: false
provenance:
  lisensi: MIT
  sumberLisensi: 'https://github.com/fitrahive/dua-dhikr'
  atribusiWajib: true
  atribusi: 'dua-dhikr oleh fitrahive (MIT)'
  syaratUrl: 'https://github.com/fitrahive/dua-dhikr'
  redistribusi: boleh
  kebijakanMirror: 'Boleh - repo sumbernya MIT dan datanya statis. Belum diaktifkan karena belum ada alat yang memakainya.'
  batasAkses: null
