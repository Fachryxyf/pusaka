endpoints:
  - id: pembalap
    method: GET
    path: '/ergast/f1/{tahun}/drivers/?format=json'
    deskripsi: 'Daftar pembalap pada satu musim: nama, kebangsaan, nomor.'
    params:
      - nama: tahun
        contoh: '2023'
        wajib: true
        keterangan: 'tahun musim, mis. 2023'
    contohPath: '/ergast/f1/2023/drivers/?format=json'
    minUkuranByte: 300
  - id: tim
    method: GET
    path: '/ergast/f1/{tahun}/constructors/?format=json'
    deskripsi: 'Daftar konstruktor (tim) pada satu musim: nama, kebangsaan.'
    params:
      - nama: tahun
        contoh: '2023'
        wajib: true
        keterangan: 'tahun musim, mis. 2023'
    contohPath: '/ergast/f1/2023/constructors/?format=json'
    minUkuranByte: 200
