endpoints:
  - id: daftar
    method: GET
    path: '/api/v1/digimon?pageSize={batas}'
    deskripsi: 'Daftar Digimon: id, name, href, image.'
    params:
      - nama: batas
        contoh: '5'
        wajib: true
        keterangan: 'jumlah entri per halaman'
    contohPath: '/api/v1/digimon?pageSize=5'
    minUkuranByte: 150
  - id: detail
    method: GET
    path: '/api/v1/digimon/{nama}'
    deskripsi: 'Profil satu Digimon: level, tipe, atribut, gambar, deskripsi.'
    params:
      - nama: nama
        contoh: 'agumon'
        wajib: true
        keterangan: 'nama Digimon (mis. agumon)'
    contohPath: /api/v1/digimon/agumon
    minUkuranByte: 100
