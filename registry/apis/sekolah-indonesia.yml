slug: sekolah-indonesia
nama: Data Sekolah Indonesia
kategori: pendidikan
deskripsi: Daftar sekolah se-Indonesia beserta NPSN, alamat, dan koordinat.
developer:
  nama: Alwan (wanrabbae)
  profil: 'https://github.com/wanrabbae'
dokumentasi: 'https://github.com/wanrabbae/api-sekolah-indonesia'
upstreamName: API Data Sekolah Indonesia
auth: none
cors: open
baseUrl: 'https://api-sekolah-indonesia.vercel.app'
mirror: false
provenance:
  lisensi: GPL-3.0
  sumberLisensi: 'https://github.com/wanrabbae/api-sekolah-indonesia'
  atribusiWajib: true
  atribusi: 'api-sekolah-indonesia oleh wanrabbae (GPL-3.0)'
  syaratUrl: 'https://github.com/wanrabbae/api-sekolah-indonesia'
  redistribusi: boleh
  kebijakanMirror: 'Boleh secara lisensi (GPL-3.0), tapi endpointnya berparameter dan datanya 215 ribu baris - tidak bisa di-snapshot utuh.'
  batasAkses: null
  diperiksa: '2026-08-21'
endpoints:
  - id: daftar
    method: GET
    path: '/sekolah?page={halaman}&perPage={perHalaman}'
    deskripsi: 'Berhalaman, 215.373 baris total. Galat dibalas dengan status 200 dan status:failed di body - WAJIB cek status === success. Filter selain npsn dan sekolah DIABAIKAN tanpa galat. lintang & bujur berupa STRING. Sesekali 504 lalu berhasil pada percobaan berikutnya (cold start).'
    params:
      - nama: halaman
        contoh: '1'
        wajib: true
        keterangan: Nomor halaman
      - nama: perHalaman
        contoh: '2'
        wajib: true
        keterangan: 'Jumlah data per halaman. Tidak dibatasi server (500 pun dilayani), tapi jangan besar-besar - datanya 215 ribu baris di database orang'
    contohPath: '/sekolah?page=1&perPage=2'
    minUkuranByte: 460
  - id: cariNama
    method: GET
    path: '/sekolah/s?sekolah={nama}'
    deskripsi: 'Pencarian nama sekolah - SATU-SATUNYA jalur yang benar-benar menyaring. total_data di sini berisi jumlah yang cocok, bukan 215.373. Catatan: /sekolah?sekolah= TIDAK menyaring meski tidak memberi galat.'
    params:
      - nama: nama
        contoh: 'pegangsaan'
        wajib: true
        keterangan: Potongan nama sekolah, tidak peka huruf besar-kecil
    contohPath: '/sekolah/s?sekolah=pegangsaan'
    minUkuranByte: 700
  - id: cariNpsn
    method: GET
    path: '/sekolah?npsn={npsn}'
    deskripsi: 'Satu sekolah berdasarkan NPSN. Pakai bentuk ini, BUKAN /sekolah/npsn?npsn= yang membalas status:success dengan dataSekolah kosong meski NPSN-nya ada.'
    params:
      - nama: npsn
        contoh: '20104653'
        wajib: true
        keterangan: 'Nomor Pokok Sekolah Nasional, STRING 8 digit - jangan parseInt'
    contohPath: '/sekolah?npsn=20104653'
    minUkuranByte: 460
