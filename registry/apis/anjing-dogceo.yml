endpoints:
  - id: daftarRas
    method: GET
    path: /api/breeds/list/all
    deskripsi: Daftar seluruh ras dan sub-rasnya dalam objek bersarang.
    params: []
    contohPath: /api/breeds/list/all
    minUkuranByte: 500
  - id: gambarAcak
    method: GET
    path: /api/breeds/image/random
    deskripsi: Satu URL gambar anjing acak dari ras mana saja.
    params: []
    contohPath: /api/breeds/image/random
    minUkuranByte: 40
  - id: gambarRas
    method: GET
    path: '/api/breed/{ras}/images/random'
    deskripsi: 'Satu URL gambar acak dari ras tertentu. ras = kunci dari endpoint daftarRas, mis. hound.'
    params:
      - nama: ras
        contoh: 'hound'
        wajib: true
        keterangan: 'nama ras (kunci dari daftar ras)'
    contohPath: /api/breed/hound/images/random
    minUkuranByte: 40
