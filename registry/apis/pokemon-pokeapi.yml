endpoints:
  - id: pokemon
    method: GET
    path: '/api/v2/pokemon/{nama}'
    deskripsi: 'Data satu Pokémon: statistik, tipe, kemampuan, sprite. nama atau nomor id.'
    params:
      - nama: nama
        contoh: 'pikachu'
        wajib: true
        keterangan: 'nama Pokémon atau id angka'
    contohPath: /api/v2/pokemon/pikachu
    minUkuranByte: 1000
  - id: spesies
    method: GET
    path: '/api/v2/pokemon-species/{nama}'
    deskripsi: 'Info spesies: tingkat evolusi, warna, habitat, deskripsi pokedex multi-bahasa.'
    params:
      - nama: nama
        contoh: 'pikachu'
        wajib: true
        keterangan: 'nama spesies atau id angka'
    contohPath: /api/v2/pokemon-species/pikachu
    minUkuranByte: 1000
