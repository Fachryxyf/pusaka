endpoints:
  - id: cari
    method: GET
    path: /api/json/v1/1/search.php
    deskripsi: 'Cari resep berdasarkan nama. Balas {"meals": null} kalau tidak ada yang cocok.'
    params:
      - nama: s
        contoh: 'rendang'
        wajib: true
        keterangan: 'kata kunci nama masakan'
    contohPath: '/api/json/v1/1/search.php?s=rendang'
    minUkuranByte: 100
  - id: detail
    method: GET
    path: /api/json/v1/1/lookup.php
    deskripsi: 'Detail satu resep berdasarkan idMeal.'
    params:
      - nama: i
        contoh: '53053'
        wajib: true
        keterangan: 'idMeal'
    contohPath: '/api/json/v1/1/lookup.php?i=53053'
    minUkuranByte: 300
  - id: kategori
    method: GET
    path: /api/json/v1/1/categories.php
    deskripsi: Daftar kategori masakan beserta gambar dan deskripsinya.
    params: []
    contohPath: /api/json/v1/1/categories.php
    minUkuranByte: 1000
  - id: acak
    method: GET
    path: /api/json/v1/1/random.php
    deskripsi: Satu resep acak. Ukuran berubah tiap panggilan, tapi selalu satu objek meal penuh.
    params: []
    contohPath: /api/json/v1/1/random.php
    pantauUmur: false
    minUkuranByte: 300
