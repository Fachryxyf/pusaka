    params:
      - nama: lat
        contoh: '-6.2'
        wajib: true
        keterangan: 'lintang'
      - nama: lon
        contoh: '106.8'
        wajib: true
        keterangan: 'bujur'
      - nama: model
        contoh: 'icon_seamless'
        wajib: true
        keterangan: 'nama model'

    contohPath: '/v1/ensemble?latitude=-6.2&longitude=106.8&hourly=temperature_2m&models=icon_seamless&forecast_days=3'
    minUkuranByte: 5000
