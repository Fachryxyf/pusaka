mirror: false
provenance:
  lisensi: unknown
  sumberLisensi: null
  atribusiWajib: false
  atribusi: 'finalspaceapi.com; Final Space milik pembuat/penyiarnya'
  syaratUrl: 'https://finalspaceapi.com/'
  redistribusi: unknown
