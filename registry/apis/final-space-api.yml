endpoints:
  - id: daftar
    method: GET
    path: '/api/v0/character?limit={batas}'
    deskripsi: 'Daftar tokoh: name, status, species, gender, alias.'
    params:
      - nama: batas
        contoh: '5'
        wajib: true
        keterangan: 'jumlah tokoh'
    contohPath: '/api/v0/character?limit=5'
    minUkuranByte: 200
  - id: detail
    method: GET
    path: '/api/v0/character/{id}'
    deskripsi: 'Detail satu tokoh menurut id.'
    params:
      - nama: id
        contoh: '1'
        wajib: true
        keterangan: 'id tokoh'
    contohPath: /api/v0/character/1
    minUkuranByte: 100
