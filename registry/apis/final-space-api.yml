slug: final-space-api
nama: 'Final Space'
kategori: hiburan
deskripsi: Data tokoh serial animasi Final Space - status, spesies, gender, dan asal.
developer:
  nama: David Erbelding
  profil: 'https://finalspaceapi.com/'
dokumentasi: 'https://finalspaceapi.com/docs/'
upstreamName: null
auth: none
cors: open
