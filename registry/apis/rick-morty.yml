    deskripsi: 'Data satu karakter berdasarkan id: nama, status, spesies, asal, lokasi, gambar.'
    params:
      - nama: id
        contoh: '1'
        wajib: true
        keterangan: 'id karakter (angka)'
    contohPath: /api/character/1
    pantauUmur: false
    minUkuranByte: 300
  - id: daftarKarakter
    method: GET
    path: /api/character
    deskripsi: 'Daftar karakter berpaginasi. Objek info (count, pages, next, prev) + array results.'
    params: []
    contohPath: /api/character
    pantauUmur: false
    minUkuranByte: 2000
