slug: kualitas-udara-open-meteo
nama: 'Kualitas Udara'
kategori: cuaca
deskripsi: Indeks kualitas udara dan konsentrasi polutan (PM2.5, PM10, US AQI) untuk titik koordinat mana pun, tanpa API key.
developer:
  nama: Open-Meteo
  profil: 'https://github.com/open-meteo'
dokumentasi: 'https://open-meteo.com/en/docs/air-quality-api'
upstreamName: null
auth: none
cors: open
baseUrl: 'https://air-quality-api.open-meteo.com'
mirror: false
provenance:
  lisensi: CC-BY-4.0
  sumberLisensi: 'https://open-meteo.com/en/terms'
  atribusiWajib: true
  atribusi: 'Data kualitas udara oleh Open-Meteo.com (CC BY 4.0), berbasis CAMS'
  syaratUrl: 'https://open-meteo.com/en/terms'
  redistribusi: boleh
  kebijakanMirror: 'Boleh dengan atribusi - data API berlisensi CC BY 4.0.'
  batasAkses: 'Gratis untuk penggunaan non-komersial, kira-kira 10.000 panggilan/hari tanpa API key.'
  diperiksa: '2026-10-07'
endpoints:
  - id: sekarang
    method: GET
    path: /v1/air-quality
    deskripsi: 'Kualitas udara saat ini pada satu koordinat. Pakai current= untuk variabel dan timezone= untuk zona lokal.'
    params:
      - nama: latitude
        contoh: '-6.2'
        wajib: true
        keterangan: 'lintang titik'
      - nama: longitude
        contoh: '106.8'
        wajib: true
        keterangan: 'bujur titik'
      - nama: current
        contoh: 'pm10,pm2_5,us_aqi'
        wajib: false
        keterangan: 'daftar variabel saat ini, pisah koma'
      - nama: timezone
        contoh: 'Asia/Jakarta'
        wajib: false
        keterangan: 'zona waktu IANA; tanpa ini waktunya GMT'
    contohPath: '/v1/air-quality?latitude=-6.2&longitude=106.8&current=pm10,pm2_5,us_aqi&timezone=Asia%2FJakarta'
    minUkuranByte: 150
