slug: catur-chesscom
nama: 'Profil Catur (Chess.com)'
kategori: hiburan
deskripsi: Profil dan statistik pemain di Chess.com - rating blitz, bullet, rapid, dan harian.
developer:
  nama: Chess.com
  profil: 'https://www.chess.com/news/view/published-data-api'
dokumentasi: 'https://www.chess.com/news/view/published-data-api'
upstreamName: null
auth: none
cors: open
baseUrl: 'https://api.chess.com'
mirror: false
provenance:
  lisensi: unknown
  sumberLisensi: null
  atribusiWajib: false
  atribusi: 'Chess.com Published-Data API'
  syaratUrl: 'https://www.chess.com/news/view/published-data-api'
  redistribusi: unknown
  kebijakanMirror: 'unknown - data profil publik milik Chess.com dan penggunanya.'
