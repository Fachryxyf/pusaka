endpoints:
  - id: profil
    method: GET
    path: '/pub/player/{username}'
    deskripsi: 'Profil pemain: nama, negara, status, tanggal gabung, follower.'
    params:
      - nama: username
        contoh: 'hikaru'
        wajib: true
        keterangan: 'nama pengguna Chess.com'
    contohPath: /pub/player/hikaru
    minUkuranByte: 100
  - id: statistik
    method: GET
    path: '/pub/player/{username}/stats'
    deskripsi: 'Statistik rating per mode: blitz, bullet, rapid, daily, puzzle.'
    params:
      - nama: username
        contoh: 'hikaru'
        wajib: true
        keterangan: 'nama pengguna Chess.com'
    contohPath: /pub/player/hikaru/stats
    minUkuranByte: 100
