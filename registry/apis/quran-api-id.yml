  batasAkses: null
  diperiksa: '2026-08-21'
endpoints:
  - id: daftarSurat
    method: GET
    path: /surah
    deskripsi: 114 surat (89 KB).
    params: []
    contohPath: /surah
    minUkuranByte: 45926
  - id: detailSurat
    method: GET
    path: '/surah/{nomor}'
    deskripsi: Satu surat lengkap dengan semua ayat (341 KB — respons terbesar di katalog).
    params:
      - nama: nomor
        contoh: '18'
        wajib: true
        keterangan: Nomor surat 1-114
    contohPath: /surah/18
    minUkuranByte: 174643
  - id: ayat
    method: GET
    path: '/surah/{nomor}/{ayat}'
    deskripsi: Satu ayat spesifik.
    params:
      - nama: nomor
        contoh: '18'
        wajib: true
        keterangan: Nomor surat 1-114
      - nama: ayat
        contoh: '60'
        wajib: true
        keterangan: Nomor ayat dalam surat
    contohPath: /surah/18/60
    minUkuranByte: 4608
