    method: GET
    path: '/api/games?platform={platform}'
    deskripsi: 'Daftar game gratis tersaring per platform (pc, browser, all).'
    params:
      - nama: platform
        contoh: 'pc'
        wajib: true
        keterangan: 'pc, browser, atau all'
