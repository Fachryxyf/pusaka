    minUkuranByte: 300
  - id: detail
    method: GET
    path: '/api/game?id={id}'
    deskripsi: 'Detail satu game: deskripsi panjang, spesifikasi minimum, galeri, penerbit.'
    params:
      - nama: id
        contoh: '540'
        wajib: true
        keterangan: 'id game dari daftar'
    contohPath: '/api/game?id=540'
    minUkuranByte: 200
