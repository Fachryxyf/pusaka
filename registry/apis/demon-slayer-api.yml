developer:
  nama: Daniela Carrasco
  profil: 'https://www.demonslayer-api.com/'
dokumentasi: 'https://www.demonslayer-api.com/documentation'
upstreamName: null
auth: none
cors: open
baseUrl: 'https://www.demonslayer-api.com'
mirror: false
provenance:
  lisensi: unknown
  sumberLisensi: null
  atribusiWajib: false
  atribusi: 'demonslayer-api.com; Demon Slayer milik Koyoharu Gotouge/Ufotable'
