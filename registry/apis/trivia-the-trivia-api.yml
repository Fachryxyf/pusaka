endpoints:
  - id: acak
    method: GET
    path: '/v2/questions?limit={batas}'
    deskripsi: 'Soal trivia acak: category, question, correctAnswer, incorrectAnswers.'
    params:
      - nama: batas
        contoh: '5'
        wajib: true
        keterangan: 'jumlah soal'
    contohPath: '/v2/questions?limit=5'
    minUkuranByte: 150
  - id: kategori
    method: GET
    path: '/v2/questions?categories={kategori}&limit=5'
    deskripsi: 'Soal trivia dari kategori tertentu.'
    params:
      - nama: kategori
        contoh: 'science'
        wajib: true
        keterangan: 'mis. science, geography, history, music, sport_and_leisure'
    contohPath: '/v2/questions?categories=science&limit=5'
    minUkuranByte: 150
