endpoints:
  - id: kocokBaru
    method: GET
    path: '/api/deck/new/shuffle/?deck_count={jumlahDek}'
    deskripsi: 'Buat dek baru yang sudah dikocok; balas deck_id untuk penarikan berikutnya.'
    params:
      - nama: jumlahDek
        contoh: '1'
        wajib: true
        keterangan: 'berapa dek digabung (1 dek = 52 kartu)'
    contohPath: '/api/deck/new/shuffle/?deck_count=1'
    minUkuranByte: 50
  - id: tarik
    method: GET
    path: '/api/deck/new/draw/?count={jumlah}'
    deskripsi: 'Buat dek baru lalu langsung tarik sejumlah kartu acak (kode, nilai, jenis, gambar).'
    params:
      - nama: jumlah
        contoh: '2'
        wajib: true
        keterangan: 'berapa kartu ditarik'
    contohPath: '/api/deck/new/draw/?count=2'
    minUkuranByte: 150
