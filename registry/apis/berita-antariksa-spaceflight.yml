slug: berita-antariksa-spaceflight
nama: 'Berita Antariksa'
kategori: berita
deskripsi: Berita terbaru seputar antariksa dan peluncuran roket, dihimpun dari berbagai media oleh Spaceflight News API.
developer:
  nama: The Space Devs
  profil: 'https://github.com/TheSpaceDevs'
dokumentasi: 'https://api.spaceflightnewsapi.net/v4/docs/'
upstreamName: null
auth: none
