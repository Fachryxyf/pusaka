  diperiksa: '2026-10-07'
endpoints:
  - id: artikel
    method: GET
    path: '/v4/articles/?limit={batas}'
    deskripsi: 'Daftar artikel terbaru. Objek {count, next, previous, results[]}.'
    params:
      - nama: batas
        contoh: '5'
        wajib: true
        keterangan: 'jumlah artikel'
    contohPath: '/v4/articles/?limit=5'
    minUkuranByte: 300
  - id: detail
    method: GET
    path: '/v4/articles/{id}/'
    deskripsi: 'Detail satu artikel berdasarkan id.'
    params:
      - nama: id
        contoh: '40277'
        wajib: true
        keterangan: 'id artikel (angka)'
    contohPath: /v4/articles/40277/
    minUkuranByte: 200
