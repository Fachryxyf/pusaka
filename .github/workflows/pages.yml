name: Deploy ke GitHub Pages

on:
  push:
    branches: [xyf]
  # Penyegaran berkala ditangani probe.yml, yang juga menjalankan mirror lalu
  # men-deploy. Dua workflow dengan jadwal sendiri hanya akan berebut concurrency
  # group yang sama.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Deploy yang sedang jalan dibiarkan selesai; yang menunggu diganti yang terbaru.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bangun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Snapshot disegarkan tiap deploy lalu ikut masuk artefak — TIDAK di-commit
      # balik. Artinya workflow ini tidak butuh izin tulis sama sekali, dan
      # data di produksi selalu semuda deploy terakhir.
      - run: npm run mirror
      # SENGAJA tidak ada `npm run probe` di sini (SPEC §9): tiap push yang ikut
      # memprobe menambah beban ke hulu dan berisiko kena batas laju. Artefak membawa
      # public/status.json versi commit apa adanya; kesegaran dijaga probe.yml tiap
      # 6 jam. Endpoint baru menunggu maksimal satu jadwal untuk cek pertamanya.
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: bangun
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
