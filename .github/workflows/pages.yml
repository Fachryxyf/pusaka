name: Deploy ke GitHub Pages

on:
  push:
    branches: [xyf]
  # Tiap 6 jam: menyegarkan snapshot mirror di produksi tanpa perlu ada push.
  # Jangan lebih sering — banyak API ini dibiayai developernya dari kantong sendiri
  # (SPEC §9).
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Deploy yang sedang jalan dibiarkan selesai; yang menunggu diganti yang terbaru.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bangun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Snapshot disegarkan tiap deploy lalu ikut masuk artefak — TIDAK di-commit
      # balik. Artinya workflow ini tidak butuh izin tulis sama sekali, dan
      # data di produksi selalu semuda deploy terakhir.
      - run: npm run mirror
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: bangun
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
