name: Deploy ke GitHub Pages

on:
  push:
    branches: [xyf]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Deploy yang sedang jalan dibiarkan selesai; yang menunggu diganti yang terbaru.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bangun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Snapshot mirror disegarkan tiap deploy: API tanpa CORS (jpl-ssd) hanya bisa
      # dibaca browser dari mirror ini.
      - run: npm run mirror
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: bangun
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
