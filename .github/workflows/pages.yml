name: Deploy ke GitHub Pages

on:
  push:
    branches: [xyf]
  # Penyegaran berkala ditangani probe.yml, yang juga menjalankan mirror lalu
  # men-deploy. Dua workflow dengan jadwal sendiri hanya akan berebut concurrency
  # group yang sama.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Deploy yang sedang jalan dibiarkan selesai; yang menunggu diganti yang terbaru.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bangun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Snapshot disegarkan tiap deploy lalu ikut masuk artefak — TIDAK di-commit
      # balik. Artinya workflow ini tidak butuh izin tulis sama sekali, dan
      # data di produksi selalu semuda deploy terakhir.
      - run: npm run mirror
      # Probe juga dijalankan di sini, kalau tidak status.json akan HILANG dari
      # artefak tiap kali ada push — dan bersamanya seluruh riwayat, karena
      # riwayat disimpan di dalam berkas itu (SPEC §3.1).
      - run: npm run probe
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: bangun
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
